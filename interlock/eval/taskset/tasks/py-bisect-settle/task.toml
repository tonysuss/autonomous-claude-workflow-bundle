id = "py-bisect-settle"
repository = "."
workflow = "investigation"
environment = "linux-python3"
intent = '''
Since a recent change, `python3 -m tally settle` sometimes prints a transfer of 0.00. For `examples/trip.csv` it now prints `Dan -> Cal  0.00` between the two real transfers; it did not do that before. `checks/settle-repro.sh` reproduces it: the script fails on the current code.

Find the commit that introduced this regression. This is an investigation: do not fix the bug and leave every file as it is. In your final message, say briefly how you confirmed the answer, and give the full SHA of that commit on a line of its own as `ANSWER: <sha>`.
'''

[budget]
max_attempts = 3

# interlock has no way to say "no file may change": an empty scope allows
# every path. The investigation workflow denies edit tools instead; the
# harness still counts any change as a scope violation, and tells the plain
# condition, in its prompt, that no file may change.

[[criterion]]
id = "answer"
statement = "The worker's ANSWER line names the first commit at which the reproduction in `checks/settle-repro.sh` fails, and the reproduction passes at that commit's parent"
min_strength = "observed"
producer = "independent"
