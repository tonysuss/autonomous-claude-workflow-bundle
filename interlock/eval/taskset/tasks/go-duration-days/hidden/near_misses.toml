# Plausible partial fixes. selftest requires each to fail at least one hidden case.

[[near_miss]]
name = "a whole number followed by d, as a special case"
from = "start"
[[near_miss.edit]]
path = "getters.go"
old = "\td, err := time.ParseDuration(v)\n"
new = "\tif n, err := strconv.Atoi(strings.TrimSuffix(v, \"d\")); err == nil && strings.HasSuffix(v, \"d\") {\n\t\treturn time.Duration(n) * 24 * time.Hour, nil\n\t}\n\td, err := time.ParseDuration(v)\n"

[[near_miss]]
name = "a decimal number followed by d, as a special case (no other units with it)"
from = "start"
[[near_miss.edit]]
path = "getters.go"
old = "\td, err := time.ParseDuration(v)\n"
new = "\tif f, err := strconv.ParseFloat(strings.TrimSuffix(v, \"d\"), 64); err == nil && strings.HasSuffix(v, \"d\") {\n\t\treturn time.Duration(f * float64(24*time.Hour)), nil\n\t}\n\td, err := time.ParseDuration(v)\n"
