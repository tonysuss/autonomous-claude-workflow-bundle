[package]
name = "interlock-schema"
description = "Record types for interlock, checked against the JSON Schema files that define them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
validate = ["dep:jsonschema"]

[dependencies]
chrono.workspace = true
jsonschema = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema.workspace = true
# The conformance tests validate records, so they build with `validate` on
# even when this crate is tested alone.
interlock-schema = { path = ".", features = ["validate"] }

[lints]
workspace = true
