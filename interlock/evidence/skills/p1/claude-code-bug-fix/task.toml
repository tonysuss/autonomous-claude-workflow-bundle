id = "parse-duration-sum"
repository = "."
workflow = "bug-fix"
intent = "parse_duration(\"1h30m\") in durations.py returns 1800 instead of 5400; compound durations must sum all their parts."

[budget]
max_attempts = 3

[scope]
paths = ["durations.py", "tests/**"]

[[criterion]]
id = "repro"
statement = "parse_duration of compound durations sums every part (1h30m is 5400)"
check = "python3 -c 'from durations import parse_duration as p; assert p(\"1h30m\")==5400 and p(\"2m10s\")==130 and p(\"45s\")==45'"
min_strength = "observed"
producer = "independent"
baseline = "fails"

[[criterion]]
id = "regression"
statement = "The existing tests pass"
check = "python3 -m unittest discover -s tests"
min_strength = "tested"
producer = "self"
baseline = "passes"
